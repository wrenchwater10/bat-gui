name: Build Video Toolkit

on:
  workflow_dispatch:        # lets you press "Run workflow" manually
  push:
    branches: [main]
    paths: ['video_toolkit.py', '.github/workflows/build.yml']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller tkinterdnd2

      - name: Build VideoToolkit.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name VideoToolkit --collect-all tkinterdnd2 video_toolkit.py

      - name: Add ffmpeg + ffprobe next to the exe
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $ff = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ff.FullName dist\ffmpeg.exe
          Copy-Item (Join-Path $ff.DirectoryName "ffprobe.exe") dist\ffprobe.exe

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: VideoToolkit
          path: |
            dist/VideoToolkit.exe
            dist/ffmpeg.exe
            dist/ffprobe.exe
